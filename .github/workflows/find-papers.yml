# Runs the paper-finding agent every Monday and opens a pull request with any
# new papers. Nothing changes on the site until that pull request is merged.
# The Monday run is skipped while a previous review is still open, so your
# edits on the review branch are never overwritten. A manual run (Actions tab >
# Find new irrigation papers > Run workflow) always runs and replaces any open
# review.
#
# Backfill: tick "backfill" on a manual run to also search one past year
# (agent/backfill.json keeps track of which). Each backfill pull request is
# labelled "backfill"; merging it starts the next year automatically, until
# the first year in agent/backfill.json is done.

name: Find new irrigation papers

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC (9:17 am in New York during daylight time)
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to search (leave empty for the default)"
        required: false
        default: ""
      backfill:
        description: "Also search one past year, one pull request per year"
        type: boolean
        default: false
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: find-papers
  cancel-in-progress: false

jobs:
  check-open-review:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      open: ${{ steps.count.outputs.open }}
    steps:
      - name: Count open reviews
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head agent/new-papers --state open --json number --jq length)" >> "$GITHUB_OUTPUT"

  find-papers:
    needs: check-open-review
    if: >-
      always() && (
        (github.event_name == 'schedule' && needs.check-open-review.outputs.open == '0') ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.merged == true &&
         github.event.pull_request.head.ref == 'agent/new-papers' &&
         contains(github.event.pull_request.labels.*.name, 'backfill'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Get the website files
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Search for papers
        id: find
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}     # optional
          LOOKBACK_DAYS: ${{ github.event.inputs.days }}
          BACKFILL: ${{ github.event_name == 'pull_request' || github.event.inputs.backfill == 'true' }}
          REPORT_PATH: ${{ runner.temp }}/report.md
        run: python agent/find_papers.py

      - name: Propose the changes as a pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: agent/new-papers
          delete-branch: true
          add-paths: |
            data/papers.json
            agent/seen.json
            agent/backfill.json
          commit-message: "Agent: add irrigation papers"
          title: ${{ steps.find.outputs.title || 'New irrigation papers found by the agent' }}
          body-path: ${{ runner.temp }}/report.md
          labels: ${{ steps.find.outputs.labels || 'paper-agent' }}
