<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 4 596 380">
  <!-- GOSAT-GW (JAXA), drawn for this site: the gold bus, AMSR3's 2 m rotating reflector on the upper front,
       TANSO-3 underneath and one solar array wing. A simplified drawing, not an official picture. -->
  <defs>
    <linearGradient id="dish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/><stop offset=".55" stop-color="#c9cfd6"/><stop offset="1" stop-color="#8d96a1"/>
    </linearGradient>
    <linearGradient id="dishBack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c858f"/><stop offset="1" stop-color="#4e5660"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d5fd0"/><stop offset="1" stop-color="#22389a"/>
    </linearGradient>
    <linearGradient id="drum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa3ad"/><stop offset=".5" stop-color="#e3e7eb"/><stop offset="1" stop-color="#8a939d"/>
    </linearGradient>
  </defs>

  <!-- solar array wing -->
  <path d="M362 226 L424 202" stroke="#b9c0c8" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#d7dde4" stroke-width="2" stroke-linejoin="round">
    <path d="M424 146 L474 126 L474 238 L424 258 Z" fill="url(#cell)"/>
    <path d="M480 124 L530 104 L530 216 L480 236 Z" fill="url(#cell)"/>
    <path d="M536 102 L586 82 L586 194 L536 214 Z" fill="url(#cell)"/>
    <path d="M592 80 L642 60 L642 172 L592 192 Z" fill="url(#cell)"/>
  </g>
  <g stroke="#7f98e8" stroke-width="1" opacity=".7">
    <path d="M424 202 L474 182 M480 180 L530 160 M536 158 L586 138 M592 136 L642 116"/>
    <path d="M449 136 L449 248 M505 114 L505 226 M561 92 L561 204 M617 70 L617 182"/>
  </g>
  <path d="M424 146 L642 60 L642 92 L424 178 Z" fill="#fff" opacity=".08"/>

  <!-- bus: gold multi-layer insulation -->
  <path d="M150 178 L272 128 L362 172 L240 224 Z" fill="#f3bd4a"/>
  <path d="M150 178 L240 224 L240 340 L150 292 Z" fill="#cf8f22"/>
  <path d="M240 224 L362 172 L362 286 L240 340 Z" fill="#a9690f"/>
  <path d="M164 206 L226 238 L226 300 L164 268 Z" fill="#e0a73a" opacity=".55"/>
  <path d="M256 236 L346 198 L346 228 L256 266 Z" fill="#c98419" opacity=".7"/>
  <path d="M256 280 L346 242 L346 262 L256 300 Z" fill="#8f590b" opacity=".6"/>
  <path d="M150 178 L240 224 L362 172" fill="none" stroke="#ffd77a" stroke-width="1.5" opacity=".8"/>

  <!-- TANSO-3 under the bus -->
  <path d="M184 314 L226 336 L226 366 L184 344 Z" fill="#9aa1a9"/>
  <path d="M226 336 L278 314 L278 344 L226 366 Z" fill="#6f7780"/>
  <path d="M184 314 L236 292 L278 314 L226 336 Z" fill="#c4cad0"/>
  <ellipse cx="205" cy="350" rx="8" ry="5" fill="#2b2f35"/>

  <!-- AMSR3: box-shaped unit and rotating drum on the upper front -->
  <path d="M176 172 L222 152 L262 172 L216 192 Z" fill="#d8dde2"/>
  <path d="M176 172 L216 192 L216 206 L176 186 Z" fill="#9ea6ae"/>
  <path d="M216 192 L262 172 L262 186 L216 206 Z" fill="#7d858e"/>
  <rect x="196" y="128" width="46" height="44" fill="url(#drum)"/>
  <ellipse cx="219" cy="172" rx="23" ry="8" fill="#8a939d"/>
  <ellipse cx="219" cy="128" rx="23" ry="8" fill="#eef1f4"/>
  <!-- feed horn -->
  <path d="M232 112 L250 104 L256 122 L240 128 Z" fill="#c9a24a"/>
  <!-- reflector arm and the 2 m dish -->
  <path d="M206 128 L172 98 M232 126 L214 92" stroke="#c6ccd3" stroke-width="5" stroke-linecap="round"/>
  <g transform="rotate(-20 160 70)">
    <ellipse cx="160" cy="74" rx="104" ry="56" fill="url(#dishBack)"/>
    <ellipse cx="160" cy="68" rx="104" ry="54" fill="url(#dish)" stroke="#eef2f6" stroke-width="2.5"/>
    <ellipse cx="146" cy="58" rx="58" ry="26" fill="#fff" opacity=".22"/>
  </g>
  <circle cx="276" cy="140" r="4" fill="#d8dde2"/>
  <path d="M300 150 L300 126" stroke="#b9c0c8" stroke-width="3"/>
</svg>
